name: Daily flyer price fetch

on:
  schedule:
    - cron: "49 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch flyer prices
        run: python3 fetch_flyer.py
      - name: Commit updated DB
        run: |
          git config user.name "grocery-bot"
          git config user.email "grocery-bot@users.noreply.github.com"
          git add groceries.db
          git diff --cached --quiet || git commit -m "daily flyer prices $(date -u +%F)"
          git push
